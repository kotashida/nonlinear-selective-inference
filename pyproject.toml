[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "si-shap"
version = "0.1.0"
description = "Simulation tools for SHAP-based selective inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.0",
    "numpy==1.26.4",
    "pandas==3.0.3",
    "patsy==1.0.2",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "shap==0.49.1",
    "tqdm==4.68.4",
]

[project.optional-dependencies]
notebook = [
    "ipykernel==7.3.0",
    "statsmodels==0.14.6",
]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
